<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Pablo 💗</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(circle at top, #fff9fb, #fbd7e4);
      color: #963d60;
      text-align: center;
      font-family: "Nunito", sans-serif;
    }

    main {
      width: 100%;
      max-width: 580px;
      animation: aparecer 1.4s ease-out both;
    }

    .dedicatoria {
      margin: 0 0 16px;
      font-family: "Dancing Script", cursive;
      font-size: clamp(30px, 7vw, 44px);
    }

    h1 {
      margin: 0;
      font-family: "Dancing Script", cursive;
      font-size: clamp(52px, 12vw, 84px);
      font-weight: 700;
    }

    .corazon {
      display: inline-block;
      margin: 24px 0;
      font-size: clamp(140px, 36vw, 220px);
      line-height: 1.2;
      filter: drop-shadow(0 12px 18px #d7497840);
      animation: latir 1.3s ease-in-out infinite;
    }

    h2 {
      margin: 0 0 20px;
      font-family: "Dancing Script", cursive;
      font-size: clamp(60px, 14vw, 96px);
      font-weight: 700;
    }

    .mensaje {
      max-width: 340px;
      margin: 0 auto;
      font-size: clamp(16px, 4vw, 20px);
      line-height: 1.8;
    }

    @keyframes latir {
      0%, 100% { transform: scale(1) rotate(-4deg); }
      30% { transform: scale(1.15) rotate(4deg); }
      50% { transform: scale(1.04) rotate(-3deg); }
      70% { transform: scale(1.1) rotate(3deg); }
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .corazon {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="dedicatoria">Para Pablo 💌</p>
    <h1>Buenos días ☀️</h1>

    <div class="corazon" role="img" aria-label="Corazón">❤️</div>

    <h2>Te amo</h2>
    <p class="mensaje">
      Perdón si soy un poco petarda,<br>
      eres el mejor.
    </p>
  </main>
</body>
</html>
